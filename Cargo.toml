[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/kubiru"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Kubiru contributors"]
repository = "https://github.com/phoscoder/kubiru"
homepage = "https://github.com/phoscoder/kubiru"
keywords = ["kubernetes", "k8s", "desktop", "gpui", "dashboard"]
categories = ["gui", "development-tools"]

[workspace.dependencies]
kubiru-core = { path = "crates/kubiru-core", version = "0.1.0" }

gpui-kit = { version = "=0.7.3", features = ["tree-sitter-yaml"] }
directories = "6"
keyring = { version = "3.6", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tempfile = "3"
thiserror = "2"
url = "2"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# GPUI code idiomatically writes `Context<Self>` without `<'_>`.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"
